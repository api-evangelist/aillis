aid: aillis
name: Aillis
description: 'Aillis, Inc. (アイリス株式会社) is a Tokyo-based medical technology company founded
  in 2017 that applies machine learning to the diagnosis of infectious disease. Its flagship
  product, nodoca, is an AI-equipped pharyngeal camera cleared in Japan as an AI-based new
  medical device for influenza screening: it photographs the posterior pharyngeal wall,
  detects influenza follicles in the image, and combines those findings with body temperature
  and reported symptoms to support a physician''s diagnosis. nodoca is sold to clinics and
  hospitals as a finished end-user medical device; Aillis publishes no public developer
  portal, API reference, SDK or machine-readable contract of any kind, and its corporate site
  is a marketing site built on the STUDIO no-code platform.'
